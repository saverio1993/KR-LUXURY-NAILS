<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5e4df">
  <title>KR Luxury Nails</title>
  <meta name="description" content="Catálogo de uñas: acrílicas, gel, nail art y más. Reserva tu cita.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/icon-180.png">
</head>
<body>
  <div class="app" id="app">
    <div class="loading"><span class="script">KR Luxury Nails</span>cargando…</div>
  </div>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <span class="lb-count" id="lbCount"></span>
    <button class="lb-close" id="lbClose" aria-label="Cerrar">×</button>
    <button class="lb-prev" id="lbPrev" aria-label="Anterior">‹</button>
    <img id="lbImg" alt="">
    <div class="lb-cap" id="lbCap"></div>
    <button class="lb-next" id="lbNext" aria-label="Siguiente">›</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
